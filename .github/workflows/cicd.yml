name: Pipeline CI-CD Python

# Déclenchement automatique
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ETAPE 1 : BUILD ET TEST
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          pip install -r requirements.txt

      - name: Executer les tests
        run: |
          pytest -v

  # ETAPE 2 : DEPLOIEMENT STAGING
  deploy-staging:
    name: Deploy Staging
    needs: build-test
    runs-on: ubuntu-latest

    steps:
      - name: Simuler le deploiement staging
        run: |
          echo "Deploiement en environnement STAGING..."
          mkdir -p staging
          echo "Version de test de l'application" > staging/app.txt
          echo "Deploiement STAGING termine avec succes"

      - name: Sauvegarder la version staging
        uses: actions/upload-artifact@v4
        with:
          name: application-staging
          path: staging/

  # ETAPE 3 : DEPLOIEMENT PRODUCTION
  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Simuler le deploiement production
        run: |
          echo "Deploiement en environnement PRODUCTION..."
          mkdir -p production
          echo "Version stable de l'application" > production/app.txt
          echo "Deploiement PRODUCTION termine avec succes"

      - name: Sauvegarder la version production
        uses: actions/upload-artifact@v4
        with:
          name: application-production
          path: production/
